[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal"
version = "0.4.0"
description = "Local CPU-only dictation and text-to-speech daemon (faster-whisper + Piper/Kokoro)"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pystray>=0.19",
    "Pillow>=10.0",
    "evdev>=1.7.0; sys_platform == 'linux'",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
tts-piper = ["piper-tts>=1.7.0"]
tts-kokoro = ["kokoro-onnx>=0.6.1"]
tts = ["vocal[tts-piper,tts-kokoro]"]

[project.scripts]
vocal = "vocal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocal = ["assets/*.png"]
