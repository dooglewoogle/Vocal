[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal"
version = "0.4.0"
description = "Local CPU-only dictation and text-to-speech daemon (faster-whisper + Piper/Kokoro)"
requires-python = ">=3.10,<3.14"  # kokoro-onnx has no 3.14 release yet
license = "GPL-3.0-or-later"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.24.0",
    "pynput>=1.7.6; sys_platform != 'linux'",
    "pystray>=0.19",
    "Pillow>=10.0",
    "huggingface_hub>=0.20",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0",
    # Text-to-speech engines. Voice model files download on first use, so
    # including both costs only their Python packages.
    "piper-tts>=1.7.0",
    "kokoro-onnx>=0.6.1",
]

[project.optional-dependencies]
# Linux global hotkey. Both evdev (X11 + Wayland, reads /dev/input) and pynput
# (X11 only) need the evdev C extension, which has no wheels: python3-dev and a
# compiler are required to build it. Without this extra Linux has no hotkey;
# live dictation still works. macOS/Windows get pynput from the base install.
hotkey = ["evdev>=1.7.0; sys_platform == 'linux'", "pynput>=1.7.6; sys_platform == 'linux'"]

[project.scripts]
vocal = "vocal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocal = ["assets/*.png"]
